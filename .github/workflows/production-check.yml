name: Production check
# Free-plan replacement for Netlify's (Pro-only) deploy failure email: after each
# push to main, wait until Netlify serves this commit's build. A failure here
# makes GitHub notify the person who pushed or merged.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to check (change it to test that the failure email arrives)
        required: true
        default: https://dynamic-kleicha-52254b.netlify.app
permissions:
  contents: read
concurrency:
  group: production-check
  cancel-in-progress: true
jobs:
  deployed:
    name: Netlify serves this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-production.mjs "$SITE_URL" dist/index.html
        env:
          SITE_URL: ${{ inputs.site_url || 'https://dynamic-kleicha-52254b.netlify.app' }}
